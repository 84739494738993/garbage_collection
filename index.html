<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Collection Calendar</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: linear-gradient(135deg, #1f2937, #111827);
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    .calendar-container {
        width: 95%;
        max-width: 1000px;
        padding: 24px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 {
        margin: 0 0 16px;
        color: #111827;
        font-size: 28px;
        letter-spacing: 1px;
    }
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 6px;
        text-align: center;
    }
    th, td {
        border-radius: 10px;
        padding: 14px 0;
        font-size: 26px;
        font-weight: 700;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #1f2937;
        transition: transform 0.15s ease;
    }
    th {
        background-color: #e5e7eb;
        font-size: 16px;
        color: #374151;
        padding: 8px 0;
    }
    td {
        background-color: #f9fafb;
        border: 1px solid #e5e7eb;
    }
    td:hover {
        transform: scale(1.05);
    }
    .today {
        outline: 3px solid #ef4444;
        outline-offset: -3px;
    }
    .legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin-top: 18px;
        font-size: 14px;
        color: #374151;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .swatch {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        display: inline-block;
        border: 1px solid rgba(0,0,0,0.2);
    }
    @media (max-width: 900px) {
        th, td {
            padding: 6px 0;
            font-size: 15px;
            border-radius: 6px;
        }
        table { border-spacing: 3px; }
        h1 { font-size: 20px; }
    }
</style>
</head>
<body>
<div class="calendar-container">
    <h1 id="calTitle">Calendar</h1>
    <table id="myTable"></table>
    <div class="legend">
        <div class="legend-item"><span class="swatch" style="background:rgb(0,200,0)"></span>Mixed waste</div>
        <div class="legend-item"><span class="swatch" style="background:yellow"></span>Recycling</div>
        <div class="legend-item"><span class="swatch" style="background:#8B4513"></span>Bio waste</div>
        <div class="legend-item"><span class="swatch" style="background:orange"></span>Bulky waste</div>
    </div>
</div>

<script>
const list_day_mixed   = [3,17,25,15,29,12,26,10,24,7,21,4,18,2,16,30,13,27,11,29,8,22];
const list_month_mixed = [4,4,4,5,5,6,6,7,7,8,8,9,9,10,10,10,11,11,12,12,1,1];

const list_day_recycling   = [22,20,17,15,12,9,7,4,2,30,27];
const list_month_recycling = [4,5,6,7,8,9,10,11,12,12,1];

const list_day_bio   = [2,16,30,14,28,11,25,9,23,6,20,3,17,1,15,29,12,26,10,19,7,21];
const list_month_bio = [4,4,4,5,5,6,6,7,7,8,8,9,9,10,10,10,11,11,12,12,1,1];

const list_day_bulky   = [20,18];
const list_month_bulky = [4,8];

const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const table = document.getElementById("myTable");
const today = new Date();
const month = today.getMonth(); // 0-indexed
const humanMonth = month + 1;   // 1-indexed, matches the data lists
const year = today.getFullYear();

const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
document.getElementById("calTitle").textContent = monthNames[month] + " " + year;

let month_day = [31,28,31,30,31,30,31,31,30,31,30,31];
if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
    month_day[1] = 29;
}

// Header row with weekday names
const headerRow = table.insertRow();
dayNames.forEach(name => {
    const th = document.createElement("th");
    th.textContent = name;
    headerRow.appendChild(th);
});

// Figure out weekday of the 1st (Monday = 0)
const firstOfMonth = new Date(year, month, 1);
let startOffset = (firstOfMonth.getDay() + 6) % 7; // convert Sun=0 -> Mon=0 based

let day = 1;
let placed = false;

while (!placed) {
    const row = table.insertRow();
    for (let j = 0; j < 7; j++) {
        const cell = row.insertCell();

        if (day === 1 && j < startOffset) {
            continue; // empty leading cell
        }
        if (day > month_day[month]) {
            placed = true;
            continue;
        }

        cell.textContent = day;

        for (let i = 0; i < list_day_mixed.length; i++) {
            if (list_day_mixed[i] === day && list_month_mixed[i] === humanMonth) {
                cell.style.backgroundColor = "rgb(0, 200, 0)";
            }
        }
        for (let i = 0; i < list_day_recycling.length; i++) {
            if (list_day_recycling[i] === day && list_month_recycling[i] === humanMonth) {
                cell.style.backgroundColor = "yellow";
            }
        }
        for (let i = 0; i < list_day_bio.length; i++) {
            if (list_day_bio[i] === day && list_month_bio[i] === humanMonth) {
                cell.style.backgroundColor = "#8B4513";
                cell.style.color = "#fff";
            }
        }
        for (let i = 0; i < list_day_bulky.length; i++) {
            if (list_day_bulky[i] === day && list_month_bulky[i] === humanMonth) {
                cell.style.backgroundColor = "orange";
            }
        }

        if (day === 3 && humanMonth === 4) {
            cell.style.background = "linear-gradient(orange 50%, green 50%)";
        }
        if (day === 16 && humanMonth === 10) {
            cell.style.background = "linear-gradient(orange 50%, green 50%)";
        }

        if (day === today.getDate()) {
            cell.classList.add("today");
        }

        day += 1;
    }
    if (day > month_day[month]) placed = true;
}
</script>
</body>
</html>
